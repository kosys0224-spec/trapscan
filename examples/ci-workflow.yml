# Example: run trapscan on every push/PR and upload results to GitHub code scanning.
name: trapscan

on: [push, pull_request]

permissions:
  contents: read
  security-events: write   # for SARIF upload

jobs:
  trapscan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: kosys0224-spec/trapscan@v0.1.0
        with:
          fail-on: high
          sarif: trapscan.sarif
      - uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: trapscan.sarif
