name: trapscan
description: Scan a repository for things that execute the moment you open it (editor auto-tasks, install hooks, agent prompt injection, git config traps).
author: Inhyeok Park
branding:
  icon: shield
  color: red
inputs:
  path:
    description: Directory (or .zip/.tar.gz) to scan
    default: .
  fail-on:
    description: Fail the step when a finding is at or above this severity (critical, high, medium, low, info, never)
    default: high
  sarif:
    description: If set, also write a SARIF file to this path (upload it with github/codeql-action/upload-sarif)
    default: ""
  args:
    description: Extra command-line arguments (e.g. --ignore GHA-UNSAFE-WORKFLOW --exclude 'docs/*')
    default: ""
runs:
  using: composite
  steps:
    - uses: actions/setup-python@v5
      with:
        python-version: "3.12"
    - shell: bash
      run: python -m pip install --quiet "${{ github.action_path }}"
    - shell: bash
      run: |
        set +e
        trapscan "${{ inputs.path }}" --no-color --fail-on "${{ inputs.fail-on }}" ${{ inputs.args }}
        code=$?
        if [ -n "${{ inputs.sarif }}" ]; then
          trapscan "${{ inputs.path }}" --sarif --fail-on never ${{ inputs.args }} > "${{ inputs.sarif }}"
        fi
        exit $code
