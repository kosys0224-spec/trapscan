name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.9", "3.12", "3.13"]
        exclude:
          - os: macos-latest
            python: "3.9"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: python -m pip install -e .
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Demo repository must be caught
        shell: bash
        run: |
          python examples/make_demo_repo.py demo-repo
          if trapscan demo-repo --no-color; then echo "expected findings"; exit 1; fi
      - name: Self-scan
        # The rule sources, fixtures and README describe traps and therefore trip the content rules on purpose.
        run: trapscan . --no-color --exclude "src/trapscan/rules/*" --exclude "examples/*" --exclude "tests/*" --exclude "docs/*" --exclude README.md
      - name: Rules doc is up to date
        shell: bash
        run: |
          python scripts/gen_rules_doc.py
          git diff --exit-code docs/rules.md
