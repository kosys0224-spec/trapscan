name: False positive
description: trapscan flagged something harmless
labels: [false-positive]
body:
  - type: input
    id: rule
    attributes:
      label: Rule id
      placeholder: e.g. NPM-LIFECYCLE
    validations:
      required: true
  - type: textarea
    id: file
    attributes:
      label: The file (or relevant part) that triggered it
      description: Paste it or link to the public repository. Redact anything private.
      render: text
    validations:
      required: true
  - type: textarea
    id: output
    attributes:
      label: trapscan output
      render: text
  - type: textarea
    id: why
    attributes:
      label: Why it is harmless
