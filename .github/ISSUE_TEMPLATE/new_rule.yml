name: New rule request
description: An auto-execution path trapscan should detect
labels: [rule-request]
body:
  - type: input
    id: trigger
    attributes:
      label: What triggers execution?
      placeholder: e.g. opening the folder in Editor X / running `tool install` / `cd` with shell plugin Y
    validations:
      required: true
  - type: textarea
    id: file
    attributes:
      label: Which file / setting carries it?
      description: Path, format, the exact key. A minimal harmless example is ideal.
      render: text
    validations:
      required: true
  - type: textarea
    id: refs
    attributes:
      label: References
      description: Docs, blog posts, CVEs, or incidents that show this is real.
  - type: dropdown
    id: severity
    attributes:
      label: Suggested default severity
      options: [critical, high, medium, low, info]
